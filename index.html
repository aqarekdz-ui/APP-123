    <script>
      (function() {
        try {
          var realFetch = window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return realFetch;
            },
            set: function(fn) {
              realFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback if defineProperty fails
          try {
            window.fetch = window.fetch;
          } catch (_) {}
        }
      })();
    </script>
