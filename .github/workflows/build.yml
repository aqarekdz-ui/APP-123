name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Unit tests
        shell: bash
        run: gradle testDebugUnitTest --stacktrace 2>&1 | tee /tmp/test.log; exit ${PIPESTATUS[0]}
        working-directory: android
      - name: Report test errors as annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import re, glob
          t = open('/tmp/test.log', encoding='utf-8', errors='replace').read().splitlines()
          keys = ('e: file:///', 'FAILED', 'What went wrong', 'Caused by', 'Exception', 'Error:', 'AssertionError', 'expected')
          out = []
          for l in t:
              if any(k in l for k in keys) and l not in out:
                  out.append(l.strip()[:240])
          msg = '%0A'.join(out[:25]).replace('\r', '')
          print('::error title=Gradle test failure::' + msg)
          PY
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: android/app/build/reports/tests/
      - run: gradle assembleDebug --stacktrace
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: dani-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - run: gradle assembleRelease --stacktrace
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: dani-apk-release
          path: android/app/build/outputs/apk/release/*.apk
